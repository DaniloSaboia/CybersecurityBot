# Local LLM stack via Ollama. Active when SPRING_PROFILES_ACTIVE=local.
# Pull models first:
#   docker compose exec ollama ollama pull llama3.1
#   docker compose exec ollama ollama pull mxbai-embed-large
spring:
  ai:
    model:
      chat: ollama
      embedding: ollama
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://ollama:11434}
      init:
        pull-model-strategy: never
      chat:
        options:
          model: ${OLLAMA_CHAT_MODEL:llama3.1}
          temperature: 0.2
      embedding:
        options:
          model: ${OLLAMA_EMBED_MODEL:mxbai-embed-large}
