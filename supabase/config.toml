# Minimal Supabase CLI config for local development.
# If `supabase start` warns about a config-version mismatch, run
# `supabase init` once to regenerate this file for your installed CLI —
# it will leave the migrations in supabase/migrations untouched.

project_id = "sentinel-kms"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
# Local dev convenience: no email confirmation step, so signup logs you straight in.
enable_confirmations = false

[inbucket]
enabled = true
port = 54324
