name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (Maven)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Require Docker and verify fresh database bootstrap
        run: |
          docker info
          python3 ../scripts/ci/smoke_db_bootstrap.py

      - name: Test quality gates
        run: python3 -m unittest discover -s ../scripts/ci -p 'test_*.py'

      - name: Build & test
        run: mvn -B -ntp clean verify

      - name: Require executed database integration tests
        run: |
          python3 ../scripts/ci/quality_gate.py junit target/surefire-reports/TEST-*IntegrationTest.xml \
            --require-suite com.sentinel.kms.integration.ApiSecurityIntegrationTest \
            --require-suite com.sentinel.kms.ingest.DurableIngestPostgresIntegrationTest \
            --require-suite com.sentinel.kms.vectorstore.HybridSearchIntegrationTest \
            --require-suite com.sentinel.kms.assistant.ChatEvidencePersistenceIntegrationTest \
            --require-suite com.sentinel.kms.kb.KnowledgeGovernanceBindingMigrationIntegrationTest \
            --require-suite com.sentinel.kms.ingest.TrustedConnectorRegistrationBoundaryIntegrationTest

      - name: Preserve backend test evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-reports
          path: backend/target/surefire-reports/
          retention-days: 14

  frontend:
    name: Frontend (Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Audit dependencies (high and critical)
        run: npm audit --audit-level=high

      - name: Build
        run: npm run build

  e2e:
    name: Frontend E2E (Playwright)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Run browser smoke and mocked HTTP-contract journeys
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
